<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EC4B6" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FF7A18" />
    </linearGradient>
    
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FF7A18" />
    </linearGradient>
  </defs>

  {/* Background */}
  <rect width="100" height="100" rx="20" fill="#18181B" />

  {/* Outer Cyber Shield Outline */}
  <path 
    d="M 50 12 L 82 24 V 52 C 82 72 50 88 50 88 C 50 88 18 72 18 52 V 24 L 50 12 Z" 
    fill="none" 
    stroke="url(#shieldGrad)" 
    stroke-width="6" 
    stroke-linejoin="round"
  />

  {/* Stylized 'P' Letter Architecture */}
  <path 
    d="M 36 30 H 58 C 66 30 70 34 70 42 C 70 50 66 54 58 54 H 36 V 72" 
    fill="none" 
    stroke="#2EC4B6" 
    stroke-width="6" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  {/* Electric Lightning Spark Burst */}
  <path 
    d="M 64 24 L 40 48 H 52 L 36 74 L 60 46 H 48 L 64 24 Z" 
    fill="url(#sparkGrad)" 
    stroke="#18181B" 
    stroke-width="1.5"
  />
</svg>
